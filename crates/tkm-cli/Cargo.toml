[package]
name = "tkm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "tkm_cli"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "time", "signal"] }
toml_edit = { workspace = true }
tkm-proto = { workspace = true }
tkm-core = { workspace = true }
tkm-hosts = { workspace = true }
tkm-decide = { workspace = true }
tkm-store = { workspace = true }
tkm-integrations = { workspace = true }
tkm-config = { workspace = true }
tkm-ui = { workspace = true }
# Later installation commands render the daemon's existing service templates.
tkmd = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "tkm"
path = "src/main.rs"
