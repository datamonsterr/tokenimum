name: Audit
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    paths: [Cargo.lock]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  checks: write
  issues: write
jobs:
  audit:
    runs-on: namespace-profile-datamonster01
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
