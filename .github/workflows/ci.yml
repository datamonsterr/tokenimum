name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  installer:
    runs-on: namespace-profile-datamonster01
    steps:
      - uses: actions/checkout@v7
      - run: bash -n install.sh
      - run: python3 scripts/tests/test_installer.py
      - name: Install the published preview using gh and authenticated curl
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          for method in gh curl; do
            if [ "$method" = gh ]; then
              gh api -H 'Accept: application/vnd.github.raw+json' \
                "repos/$GITHUB_REPOSITORY/contents/install.sh?ref=$INSTALLER_REF" > "$RUNNER_TEMP/install-$method.sh"
            else
              curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github.raw+json' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/install.sh?ref=$INSTALLER_REF" > "$RUNNER_TEMP/install-$method.sh"
            fi
            cmp install.sh "$RUNNER_TEMP/install-$method.sh"
            bash "$RUNNER_TEMP/install-$method.sh" --method "$method" --version v0.0.0 --bin-dir "$RUNNER_TEMP/tokenimum-$method/bin"
            for binary in tkm tkm-hook tkmd; do
              "$RUNNER_TEMP/tokenimum-$method/bin/$binary" --version
            done
          done
  fmt:
    runs-on: namespace-profile-datamonster01
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: cargo fmt --all --check
  shim-test:
    runs-on: namespace-profile-datamonster01
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
      - run: node scripts/test_shim_pending.mjs
  # The pinned toolchain is also the MSRV; clippy and test exercise that version.
  clippy:
    runs-on: namespace-profile-linux-xl
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  test:
    runs-on: namespace-profile-linux-xl
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run --workspace --all-features --locked --no-tests=pass
      - run: cargo test --doc --workspace --all-features --locked
  doc:
    runs-on: namespace-profile-datamonster01
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
  forbid-unsafe:
    runs-on: namespace-profile-datamonster01
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: bash scripts/check-forbid-unsafe.sh
  deny:
    runs-on: namespace-profile-datamonster01
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          command-arguments: all
          rust-version: 1.99.1
  geiger:
    runs-on: namespace-profile-linux-xl
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/tests/test_geiger_diff.py
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: geiger
          cache-bin: false
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/cache/restore@v6
        id: cargo-geiger-cache
        with:
          path: ~/.cargo/bin/cargo-geiger
          key: cargo-geiger-0.14.0-${{ runner.os }}-namespace-rust-1.99.1
      - run: cargo install cargo-geiger --version 0.14.0 --locked
        if: steps.cargo-geiger-cache.outputs.cache-hit != 'true'
      - uses: actions/cache/save@v6
        if: steps.cargo-geiger-cache.outputs.cache-hit != 'true'
        with:
          path: ~/.cargo/bin/cargo-geiger
          key: ${{ steps.cargo-geiger-cache.outputs.cache-primary-key }}
      - run: |
          set -e
          for package in tkmd tkm-cli tkm-hook; do
            cargo geiger --manifest-path "$GITHUB_WORKSPACE/crates/$package/Cargo.toml" --all-features --output-format Json > "${package}-geiger.json"
          done
          python3 scripts/geiger_diff.py tkmd-geiger.json tkm-cli-geiger.json tkm-hook-geiger.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: geiger-reports
          path: |
            tkmd-geiger.json
            tkm-cli-geiger.json
            tkm-hook-geiger.json
  core-pure:
    runs-on: namespace-profile-datamonster01
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - run: python3 scripts/tests/test_check_core_pure.py
      - run: python3 scripts/tests/test_check_spec_conformance.py && python3 scripts/check_spec_conformance.py
      - run: bash scripts/check-core-pure.sh
  # SPEC 15 M3: a fresh HOME reaches a working install with one command.
  fresh-install:
    runs-on: namespace-profile-linux-xl
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-release
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: python3 scripts/tests/test_fresh_install.py
      - run: cargo build --release --locked -p tkm-cli -p tkmd -p tkm-hook
      - run: python3 scripts/fresh_install.py --bin-dir target/release
      - run: python3 scripts/verify_readme.py --bin-dir target/release
