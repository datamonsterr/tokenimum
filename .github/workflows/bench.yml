name: Bench
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
concurrency:
  group: >-
    bench-${{ github.ref }}-${{
      github.event.action == 'labeled' && github.event.label.name != 'bench' && github.run_id || 'active'
    }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  bench:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
       (github.event.action != 'labeled' || github.event.label.name == 'bench'))
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-bench
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine@2.0.0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      # rust-cache can restore a partial target/criterion from main; Criterion then fails on a
      # missing base/sample.json. Baselines live in benchmark-data, so start Criterion clean.
      - name: Clear restored Criterion state
        run: rm -rf target/criterion
      - name: Test bench scripts
        run: |
          python3 scripts/tests/test_check_bench_budget.py
          python3 scripts/tests/test_compare_bench.py
          python3 scripts/tests/test_check_hook_latency.py
          python3 scripts/tests/test_roundtrip_benchmark.py
          python3 scripts/tests/test_perf_budget_table.py
          python3 scripts/tests/test_perf_gates_complete.py
          python3 scripts/tests/test_shim_benchmark.py
      - name: Run tkmd tool_done benchmark (budget 200 us)
        run: |
          set -o pipefail
          cargo bench --locked -p tkmd --bench tool_done -- --output-format bencher | tee tkmd-criterion.txt
          python3 scripts/check_bench_budget.py tkmd-criterion.txt tool_done_ 200000
          cp tkmd-criterion.txt criterion.txt
      - name: Run UI render benchmark (budget 50 ms)
        run: |
          set -o pipefail
          cargo bench --locked -p tkm-ui --bench render -- --output-format bencher | tee ui-criterion.txt
          python3 scripts/check_bench_budget.py ui-criterion.txt render_ 50000000
          cat ui-criterion.txt >> criterion.txt
      - name: Run prompt scoring and session folding benchmarks
        run: |
          set -o pipefail
          cargo bench --locked -p tkmd --bench prompt -- --output-format bencher | tee prompt-criterion.txt
          python3 scripts/check_bench_budget.py prompt-criterion.txt prompt/scored 1500000000
          python3 scripts/check_bench_budget.py prompt-criterion.txt prompt/cached 5000000
          cat prompt-criterion.txt >> criterion.txt
          cargo bench --locked -p tkmd --bench fold_session -- --output-format bencher | tee fold-criterion.txt
          python3 scripts/check_bench_budget.py fold-criterion.txt fold_session_ 500000000
          cat fold-criterion.txt >> criterion.txt
      - name: Run hook benchmark
        run: |
          cargo build --release --locked -p tkm-hook
          hyperfine --warmup 20 --runs 200 --input null --export-json hyperfine.json 'target/release/tkm-hook'
          python3 scripts/hyperfine_to_benchmark.py hyperfine.json hook-benchmark.json
      - name: Hook round trip against a running tkmd (p50 < 3 ms, p99 < 10 ms)
        run: |
          cargo build --release --locked -p tkmd -p tkm-hook
          scratch="$(mktemp -d)"
          export HOME="$scratch/home" XDG_DATA_HOME="$scratch/data" XDG_CONFIG_HOME="$scratch/config" XDG_RUNTIME_DIR="$scratch/run"
          mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          TKM_DECIDE_ENABLED=false target/release/tkmd &
          daemon=$!
          for _ in $(seq 1 100); do
            [ -S "$XDG_RUNTIME_DIR/tokenimum/tkmd.sock" ] && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/tokenimum/tkmd.sock" || { echo "tkmd socket never appeared" >&2; exit 1; }
          hyperfine --warmup 20 --runs 500 --shell=none \
            --input fixtures/claude/hooks/PostToolUse-bash.json \
            --export-json roundtrip.json \
            'target/release/tkm-hook --host claude --event tool_done'
          kill "$daemon"
          python3 scripts/check_hook_latency.py roundtrip.json --p50-ms 3 --p99-ms 10 --summary "$GITHUB_STEP_SUMMARY"
          python3 scripts/roundtrip_to_benchmark.py roundtrip.json roundtrip-benchmark.json
      - name: Benchmark opencode and Pi shims against tkmd
        run: |
          set -eu
          scratch="$(mktemp -d)"
          daemon=""
          cleanup() {
            if [ -n "$daemon" ]; then kill "$daemon" 2>/dev/null || true; wait "$daemon" 2>/dev/null || true; fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          export HOME="$scratch/home" XDG_DATA_HOME="$scratch/data" XDG_CONFIG_HOME="$scratch/config" XDG_RUNTIME_DIR="$scratch/run"
          export PATH="$GITHUB_WORKSPACE/target/release:$PATH"
          mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          TKM_DECIDE_ENABLED=false target/release/tkmd &
          daemon=$!
          for _ in $(seq 1 100); do
            [ -S "$XDG_RUNTIME_DIR/tokenimum/tkmd.sock" ] && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/tokenimum/tkmd.sock"
          for host in opencode pi; do
            hyperfine --warmup 20 --runs 200 --shell=none --export-json "shim-$host.json" "bun scripts/bench_shim.ts $host"
            python3 scripts/shim_benchmark.py "$host" "shim-$host.json" "shim-$host-metrics.json"
          done
          python3 -c 'import json; print(json.dumps(json.load(open("shim-opencode-metrics.json")) + json.load(open("shim-pi-metrics.json"))))' > shim-benchmark.json
      # Same job, same runner: head samples (the first is the budgeted run above) are interleaved
      # with base samples, then medians are compared and only a regression beyond noise fails.
      - name: Compare Criterion against PR base (interleaved, median, noise-aware)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          bench_one() { # <source dir> <output file> <package> <bench>
            rm -rf target/criterion
            (cd "$1" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo bench --locked -p "$3" --bench "$4" -- --output-format bencher) >> "$2"
          }
          bench_pass() { # <source dir> <output file>
            : > "$2"
            bench_one "$1" "$2" tkmd tool_done
            bench_one "$1" "$2" tkm-ui render
            bench_one "$1" "$2" tkmd prompt
            bench_one "$1" "$2" tkmd fold_session
          }
          cp criterion.txt head-1.txt
          bench_pass "$RUNNER_TEMP/base" base-1.txt
          for i in 2 3 4; do
            if [ $((i % 2)) -eq 0 ]; then
              bench_pass "$GITHUB_WORKSPACE" "head-$i.txt"
              bench_pass "$RUNNER_TEMP/base" "base-$i.txt"
            else
              bench_pass "$RUNNER_TEMP/base" "base-$i.txt"
              bench_pass "$GITHUB_WORKSPACE" "head-$i.txt"
            fi
          done
          python3 scripts/compare_bench.py --threshold 1.20 --summary "$GITHUB_STEP_SUMMARY" \
            --head head-1.txt head-2.txt head-3.txt head-4.txt \
            --base base-1.txt base-2.txt base-3.txt base-4.txt
      - uses: actions/cache/restore@v6
        with:
          path: benchmark-data
          key: benchmark-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: benchmark-v1-
      - run: mkdir -p benchmark-data
      # Pull requests compare against their own base in the step above; the stored history was
      # measured on another runner and flaked the ratio gate. Main pushes keep it for charts.
      - name: Record Criterion history
        if: github.event_name != 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          name: Criterion
          tool: cargo
          github-token: ${{ github.token }}
          output-file-path: criterion.txt
          external-data-json-path: benchmark-data/criterion.json
          alert-threshold: '120%'
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
      - name: Compare hook startup, round trip and shim against PR base (interleaved, median, noise-aware)
        if: github.event_name == 'pull_request'
        run: scripts/bench_pr_hooks.sh "$RUNNER_TEMP/base"
      - name: Compare hook startup
        if: github.event_name != 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          name: Hook
          tool: customSmallerIsBetter
          github-token: ${{ github.token }}
          output-file-path: hook-benchmark.json
          external-data-json-path: benchmark-data/hook.json
          alert-threshold: '120%'
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
      - name: Compare hook round trip percentiles
        if: github.event_name != 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          name: Hook round trip
          tool: customSmallerIsBetter
          github-token: ${{ github.token }}
          output-file-path: roundtrip-benchmark.json
          external-data-json-path: benchmark-data/roundtrip.json
          alert-threshold: '120%'
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
      - name: Compare shim percentiles
        if: github.event_name != 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          name: Shim
          tool: customSmallerIsBetter
          github-token: ${{ github.token }}
          output-file-path: shim-benchmark.json
          external-data-json-path: benchmark-data/shim.json
          alert-threshold: '120%'
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
      - name: Save main baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: benchmark-data
          key: benchmark-v1-${{ github.run_id }}-${{ github.run_attempt }}
  idle-memory:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'bench') &&
       (github.event.action != 'labeled' || github.event.label.name == 'bench'))
    runs-on: ${{ vars.CI_HEAVY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-idle-memory
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Test memory budget checker
        run: |
          python3 scripts/tests/test_check_idle_memory.py
          python3 scripts/tests/test_idle_metrics.py
      - name: Measure daemon idle memory
        run: |
          set -eu
          cargo build --release --locked -p tkmd
          cp target/release/tkmd /tmp/tkmd-default
          cargo build --release --locked -p tkmd --features web
          cp target/release/tkmd /tmp/tkmd-web
          scratch="$(mktemp -d)"
          daemon=""
          cleanup() {
            if [ -n "$daemon" ]; then kill "$daemon" 2>/dev/null || true; wait "$daemon" 2>/dev/null || true; fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          for variant in default web; do
            export HOME="$scratch/$variant/home" XDG_DATA_HOME="$scratch/$variant/data" XDG_CONFIG_HOME="$scratch/$variant/config" XDG_RUNTIME_DIR="$scratch/$variant/run"
            mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            if [ "$variant" = web ]; then
              TKM_DECIDE_ENABLED=false TKM_UI_WEB_ENABLED=true TKM_UI_WEB_BIND=127.0.0.1:0 /tmp/tkmd-web &
            else
              TKM_DECIDE_ENABLED=false /tmp/tkmd-default &
            fi
            daemon=$!
            for _ in $(seq 1 100); do
              [ -S "$XDG_RUNTIME_DIR/tokenimum/tkmd.sock" ] && break
              sleep 0.1
            done
            test -S "$XDG_RUNTIME_DIR/tokenimum/tkmd.sock"
            sleep 5
            if [ "$variant" = web ]; then
              info="$XDG_RUNTIME_DIR/tokenimum/tkmd-web.json"
              test -f "$info"
              url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"].split("#")[0].rstrip("/"))' "$info")"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$url/api/state")" = 401
              limit=40
            else
              limit=30
            fi
            samples="$scratch/$variant.samples"
            for _ in 1 2 3; do
              awk '/^VmRSS:/ {print $2}' "/proc/$daemon/status" >> "$samples"
              sleep 1
            done
            python3 scripts/check_idle_memory.py "$samples" "$limit" "$variant"
            python3 scripts/idle_metrics.py "$daemon" "$variant" "$samples" "idle-$variant.json"
            kill "$daemon"
            wait "$daemon" || true
            daemon=""
          done
      - uses: actions/cache/restore@v6
        with:
          path: idle-benchmark-data
          key: idle-benchmark-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: idle-benchmark-v2-
      - run: mkdir -p idle-benchmark-data
      - name: Compare idle CPU and memory against PR base (interleaved, median, noise-aware)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -eu
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          scripts/bench_pr_idle.sh "$RUNNER_TEMP/base"
      - name: Compare default idle CPU and memory
        if: github.event_name != 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          name: Default idle
          tool: customSmallerIsBetter
          github-token: ${{ github.token }}
          output-file-path: idle-default.json
          external-data-json-path: idle-benchmark-data/default.json
          alert-threshold: '120%'
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
      - name: Compare web idle CPU and memory
        if: github.event_name != 'pull_request'
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          name: Web idle
          tool: customSmallerIsBetter
          github-token: ${{ github.token }}
          output-file-path: idle-web.json
          external-data-json-path: idle-benchmark-data/web.json
          alert-threshold: '120%'
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
      - name: Save main idle baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: idle-benchmark-data
          key: idle-benchmark-v2-${{ github.run_id }}-${{ github.run_attempt }}
