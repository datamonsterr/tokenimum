name: Bench
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
jobs:
  bench:
    runs-on: namespace-profile-linux-xl
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-bench
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine@2.0.0
      # rust-cache can restore a partial target/criterion from main; Criterion then fails on a
      # missing base/sample.json. Baselines live in benchmark-data, so start Criterion clean.
      - name: Clear restored Criterion state
        run: rm -rf target/criterion
      - name: Run Criterion placeholder
        run: cargo bench --locked -p tkm-core --bench placeholder -- --output-format bencher | tee criterion.txt
      - name: Test bench scripts
        run: |
          python3 scripts/tests/test_check_bench_budget.py
          python3 scripts/tests/test_check_hook_latency.py
      - name: Run tkmd tool_done benchmark (budget 200 us)
        run: |
          cargo bench --locked -p tkmd --bench tool_done -- --output-format bencher | tee tkmd-criterion.txt
          python3 scripts/check_bench_budget.py tkmd-criterion.txt tool_done_ 200000
          cat tkmd-criterion.txt >> criterion.txt
      - name: Run UI render benchmark (budget 50 ms)
        run: |
          cargo bench --locked -p tkm-ui --bench render -- --output-format bencher | tee ui-criterion.txt
          python3 scripts/check_bench_budget.py ui-criterion.txt render_ 50000000
          cat ui-criterion.txt >> criterion.txt
      - name: Run hook benchmark
        run: |
          cargo build --release --locked -p tkm-hook
          hyperfine --warmup 20 --runs 200 --input null --export-json hyperfine.json 'target/release/tkm-hook'
          python3 scripts/hyperfine_to_benchmark.py hyperfine.json hook-benchmark.json
      - name: Hook round trip against a running tkmd (p50 < 3 ms, p99 < 10 ms)
        run: |
          cargo build --release --locked -p tkmd -p tkm-hook
          scratch="$(mktemp -d)"
          export HOME="$scratch/home" XDG_DATA_HOME="$scratch/data" XDG_CONFIG_HOME="$scratch/config" XDG_RUNTIME_DIR="$scratch/run"
          mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          TKM_DECIDE_ENABLED=false target/release/tkmd &
          daemon=$!
          for _ in $(seq 1 100); do
            [ -S "$XDG_RUNTIME_DIR/tokenimum/tkmd.sock" ] && break
            sleep 0.1
          done
          test -S "$XDG_RUNTIME_DIR/tokenimum/tkmd.sock" || { echo "tkmd socket never appeared" >&2; exit 1; }
          hyperfine --warmup 20 --runs 500 --shell=none \
            --input fixtures/claude/hooks/PostToolUse-bash.json \
            --export-json roundtrip.json \
            'target/release/tkm-hook --host claude --event tool_done'
          kill "$daemon"
          python3 scripts/check_hook_latency.py roundtrip.json --p50-ms 3 --p99-ms 10 --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/restore@v6
        with:
          path: benchmark-data
          key: benchmark-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: benchmark-v1-
      - run: mkdir -p benchmark-data
      # Shared runner noise can trigger the 20% gate; later epics should tune it.
      - name: Compare Criterion
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          name: Criterion
          tool: cargo
          github-token: ${{ github.token }}
          output-file-path: criterion.txt
          external-data-json-path: benchmark-data/criterion.json
          alert-threshold: '120%'
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
      - name: Compare hook startup
        uses: benchmark-action/github-action-benchmark@v1.22.2
        with:
          name: Hook
          tool: customSmallerIsBetter
          github-token: ${{ github.token }}
          output-file-path: hook-benchmark.json
          external-data-json-path: benchmark-data/hook.json
          alert-threshold: '120%'
          fail-on-alert: ${{ github.event_name == 'pull_request' }}
      - name: Save main baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: benchmark-data
          key: benchmark-v1-${{ github.run_id }}-${{ github.run_attempt }}
  idle-memory:
    runs-on: namespace-profile-linux-xl
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-idle-memory
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Test memory budget checker
        run: python3 scripts/tests/test_check_idle_memory.py
      - name: Measure daemon idle memory
        run: |
          set -eu
          cargo build --release --locked -p tkmd
          cp target/release/tkmd /tmp/tkmd-default
          cargo build --release --locked -p tkmd --features web
          cp target/release/tkmd /tmp/tkmd-web
          scratch="$(mktemp -d)"
          daemon=""
          cleanup() {
            if [ -n "$daemon" ]; then kill "$daemon" 2>/dev/null || true; wait "$daemon" 2>/dev/null || true; fi
            rm -rf "$scratch"
          }
          trap cleanup EXIT
          for variant in default web; do
            export HOME="$scratch/$variant/home" XDG_DATA_HOME="$scratch/$variant/data" XDG_CONFIG_HOME="$scratch/$variant/config" XDG_RUNTIME_DIR="$scratch/$variant/run"
            mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
            if [ "$variant" = web ]; then
              TKM_DECIDE_ENABLED=false TKM_UI_WEB_ENABLED=true TKM_UI_WEB_BIND=127.0.0.1:0 /tmp/tkmd-web &
            else
              TKM_DECIDE_ENABLED=false /tmp/tkmd-default &
            fi
            daemon=$!
            for _ in $(seq 1 100); do
              [ -S "$XDG_RUNTIME_DIR/tokenimum/tkmd.sock" ] && break
              sleep 0.1
            done
            test -S "$XDG_RUNTIME_DIR/tokenimum/tkmd.sock"
            sleep 5
            if [ "$variant" = web ]; then
              info="$XDG_RUNTIME_DIR/tokenimum/tkmd-web.json"
              test -f "$info"
              url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["url"].split("#")[0].rstrip("/"))' "$info")"
              test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$url/api/state")" = 401
              limit=40
            else
              limit=30
            fi
            samples="$scratch/$variant.samples"
            for _ in 1 2 3; do
              awk '/^VmRSS:/ {print $2}' "/proc/$daemon/status" >> "$samples"
              sleep 1
            done
            python3 scripts/check_idle_memory.py "$samples" "$limit" "$variant"
            kill "$daemon"
            wait "$daemon" || true
            daemon=""
          done
