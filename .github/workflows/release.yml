name: Release
on:
  push:
    tags: ['v*']
  # Exercise the release build on changes without granting write permissions.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Cargo.lock
      - Cargo.toml
      - crates/**
      - rust-toolchain.toml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Keep publishing disabled
        type: boolean
        default: true
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  SOURCE_DATE_EPOCH: '0'
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: namespace-profile-linux-xl
          - target: aarch64-unknown-linux-musl
            runner: namespace-profile-linux-xl
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - name: Install native build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: Install target and pinned Zig linker
        if: runner.os == 'Linux'
        run: |
          rustup target add "${{ matrix.target }}"
          python3 -m pip install --user --break-system-packages ziglang==0.17.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          cargo install --locked cargo-zigbuild --version 0.24.0
      - name: Install macOS target
        if: runner.os == 'macOS'
        run: rustup target add "${{ matrix.target }}"
      - name: Build twice, verify static linking, and compare hashes
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          export RUSTFLAGS="--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/workspace"
          for build in first second; do
            if [[ "$RUNNER_OS" == Linux ]]; then
              CARGO_TARGET_DIR="$RUNNER_TEMP/$build" cargo zigbuild --release --locked --target "$TARGET" -p tkm-cli -p tkm-hook -p tkmd
            else
              # Mach-O output can include build paths. Use the same clean target path
              # for both builds and retain only the resulting executables.
              rm -rf "$RUNNER_TEMP/mac-target"
              CARGO_TARGET_DIR="$RUNNER_TEMP/mac-target" cargo build --release --locked --target "$TARGET" -p tkm-cli -p tkm-hook -p tkmd
              mkdir -p "$RUNNER_TEMP/$build/$TARGET/release"
              cp "$RUNNER_TEMP/mac-target/$TARGET/release/"{tkm,tkm-hook,tkmd} "$RUNNER_TEMP/$build/$TARGET/release/"
            fi
          done
          if [[ "$RUNNER_OS" == macOS ]]; then
            checksum=(shasum -a 256)
          else
            checksum=(sha256sum)
          fi
          mkdir -p "dist/$TARGET"
          for binary in tkm tkm-hook tkmd; do
            first="$RUNNER_TEMP/first/$TARGET/release/$binary"
            second="$RUNNER_TEMP/second/$TARGET/release/$binary"
            description=$(file -b "$first")
            echo "$binary: $description"
            if [[ "$RUNNER_OS" == Linux ]] && { [[ "$description" == *"dynamically linked"* ]] || \
              { [[ "$description" != *"statically linked"* ]] && [[ "$description" != *"static-pie linked"* ]]; }; }; then
              echo "Expected a statically linked musl executable: $binary" >&2
              exit 1
            fi
            if [[ "$RUNNER_OS" == Linux && "$TARGET" == x86_64-* ]]; then
              ldd_output=$(ldd "$first" 2>&1 || true)
              if [[ "$ldd_output" != *"not a dynamic executable"* ]]; then
                echo "ldd did not confirm static linking for $binary: $ldd_output" >&2
                exit 1
              fi
            fi
            first_hash=$("${checksum[@]}" "$first" | cut -d ' ' -f 1)
            second_hash=$("${checksum[@]}" "$second" | cut -d ' ' -f 1)
            if [[ "$first_hash" != "$second_hash" ]]; then
              echo "Non-reproducible binary: $binary ($first_hash != $second_hash)" >&2
              exit 1
            fi
            install -m 755 "$first" "dist/$TARGET/$binary"
          done
          (cd "dist/$TARGET" && "${checksum[@]}" tkm tkm-hook tkmd > SHA256SUMS)
          tar -czf "dist/tokenimum-$TARGET.tar.gz" -C "dist/$TARGET" tkm tkm-hook tkmd SHA256SUMS
          (cd dist && "${checksum[@]}" "tokenimum-$TARGET.tar.gz" > "tokenimum-$TARGET.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: tokenimum-${{ matrix.target }}
          path: |
            dist/tokenimum-${{ matrix.target }}.tar.gz
            dist/tokenimum-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  geiger:
    name: Cargo geiger report
    runs-on: namespace-profile-linux-xl
    steps:
      - uses: actions/checkout@v7
      - run: rustup show
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y perl make
      - name: Install cargo-geiger
        run: cargo install --locked cargo-geiger --version 0.14.0 --features vendored-openssl
      - name: Generate report
        run: |
          set -euo pipefail
          for package in tkmd tkm-cli tkm-hook; do
            cargo geiger --manifest-path "$GITHUB_WORKSPACE/crates/$package/Cargo.toml" --all-features --locked --output-format Json --quiet > "${package}-geiger.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: tokenimum-cargo-geiger
          path: |
            tkmd-geiger.json
            tkm-cli-geiger.json
            tkm-hook-geiger.json
          if-no-files-found: error

  publish:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)) &&
      vars.RELEASE_PUBLISH_ENABLED == 'true'
    needs: [build, geiger]
    runs-on: namespace-profile-datamonster01
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tokenimum-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
