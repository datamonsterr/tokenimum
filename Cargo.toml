[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
repository = "https://github.com/datamonsterr/tokenimum"
version = "0.0.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[workspace.dependencies]
tokio = { version = "1.54.1" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
rusqlite = { version = "0.41.1", features = ["bundled"] }
sha2 = { version = "0.10.9" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
clap = { version = "4.6.7", features = ["derive"] }
ratatui = { version = "0.30.2" }
crossterm = { version = "0.29.0" }
axum = { version = "0.8.9" }
regex = { version = "1.13.1" }
globset = { version = "0.4.21" }
toml = { version = "1.1.6", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "0.25.17" }
directories = { version = "6.0.0" }
thiserror = { version = "2.0.21" }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
notify = { version = "8.2.1" }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1.12.0" }
tkm-proto = { path = "crates/tkm-proto" }
tkm-core = { path = "crates/tkm-core" }
tkm-hosts = { path = "crates/tkm-hosts" }
tkm-decide = { path = "crates/tkm-decide" }
tkm-store = { path = "crates/tkm-store" }
tkm-integrations = { path = "crates/tkm-integrations" }
tkm-config = { path = "crates/tkm-config" }
tkm-ui = { path = "crates/tkm-ui" }
tkm-hook = { path = "crates/tkm-hook" }
tkmd = { path = "crates/tkmd" }
tkm-cli = { path = "crates/tkm-cli" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
panic = "unwind"
debug = false
